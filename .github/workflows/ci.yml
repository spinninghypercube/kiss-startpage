name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend-svelte/package-lock.json

      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l backend-go)"
          test -z "$files" || { echo "$files"; exit 1; }

      - name: Test and vet backend
        working-directory: backend-go
        run: |
          go test ./...
          go vet ./...
          go build -buildvcs=false -o /tmp/kissdash-go .

      - name: Check shell syntax
        shell: bash
        run: bash -n ops/*.sh maintainer/*.sh

      - name: Install frontend dependencies
        working-directory: frontend-svelte
        run: npm ci --no-fund --no-audit

      - name: Build and unit-test frontend
        working-directory: frontend-svelte
        run: |
          npm run build
          npm run test:unit

      - name: Install Chromium
        working-directory: frontend-svelte
        run: npx playwright install --with-deps chromium

      - name: Run Chromium regression tests
        working-directory: frontend-svelte
        run: npm run test:e2e

      - name: Run application smoke test
        run: bash maintainer/smoke-local.sh

      - name: Build Docker image
        run: docker build -t kiss-startpage-ci .

  validate-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'ops/bootstrap-windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell installer contains syntax errors.'
          }

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Cross-build Windows backend
        working-directory: backend-go
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -buildvcs=false -o "$env:RUNNER_TEMP/kissdash-go.exe" .
